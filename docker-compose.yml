name: central-midias-api

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - central_midias_api_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: central-midias-api
    ports:
      - '127.0.0.1:4051:4051'
    env_file:
      - .env
    environment:
      PORT: '4051'
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4051/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  print-worker:
    image: central-midias-api
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ['node', 'dist/src/worker.js']
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  central_midias_api_redis_data:
    name: central-midias-api-redis-data
